<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Modern Gradient matching your theme -->
    <linearGradient id="jmsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    
    <!-- Subtle drop shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Shield Background -->
  <rect x="10" y="10" width="180" height="180" rx="45" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>

  <!-- Logo Mark: Geometric 'JM' Monogram -->
  <g filter="url(#glow)">
    <!-- Letter 'J' -->
    <path d="M 60,60 L 60,115 A 20,20 0 0,1 20,95" 
          fill="none" 
          stroke="url(#jmsGradient)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Letter 'M' -->
    <path d="M 85,125 L 85,60 L 115,100 L 145,60 L 145,125" 
          fill="none" 
          stroke="url(#jmsGradient)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Code Bracket Dot Accent -->
    <circle cx="160" cy="120" r="7" fill="#38bdf8" />
  </g>
</svg>
